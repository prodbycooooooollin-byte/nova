<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family:'Inter'; src:url(../ui/fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight:100 900; }
* { margin:0; box-sizing:border-box; }
html,body { width:480px; height:270px; overflow:hidden; background:#0b0b12; color:#ececf3; font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
body { position:relative; display:grid; place-items:center; background:radial-gradient(60% 70% at 50% 38%,#1b1840 0,#0b0b12 70%); }
.box { display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:-6px; }
img { width:84px; height:84px; filter:drop-shadow(0 10px 22px rgba(80,60,255,.45)); }
h1 { font-size:30px; font-weight:650; letter-spacing:-.035em; }
p { font-size:12.5px; color:#8b8ba0; letter-spacing:.01em; }
.bar { position:absolute; left:0; right:0; bottom:0; height:3px; background:linear-gradient(90deg,transparent,#8b7dff 45%,#cbc4ff 55%,transparent); opacity:.9; }
</style></head><body>
<div class="box"><img src="icon.png" alt=""><h1>Nova</h1><p>Getting setup ready. This can take a moment.</p></div>
<div class="bar"></div>
</body></html>
