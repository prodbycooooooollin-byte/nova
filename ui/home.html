<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>New tab</title>
<style>
@font-face { font-family:'Inter'; src:url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight:100 900; }
:root { --bg:#161621; --chrome:#0b0b12; --accent:#8b7dff; --text:#ececf3; --dim:#8b8ba0; --dimv:.25; --blurv:0px; }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; background:var(--bg); color:var(--text); font:450 14px/1.4 'Inter',system-ui,sans-serif; letter-spacing:-.006em; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; transition:background-color .35s,color .35s; }
.wp, .wp2 { position:fixed; inset:0; transition:opacity .4s; }
/* backgrounds: pixel art painted once at a third of the size and scaled up without smoothing; a calm vignette keeps the middle quiet */
.wp[data-wall="stars"], .wp[data-wall="glow"], .wp[data-wall="dots"] { background:radial-gradient(130% 110% at 50% 50%,transparent 52%,color-mix(in srgb,var(--chrome) 70%,transparent) 100%); }
.wp2 { background-size:cover; background-position:center; opacity:0; filter:blur(var(--blurv)); transform:scale(1.03); } .wp2.on { opacity:1; } .shade { position:fixed; inset:0; background:var(--bg); opacity:0; pointer-events:none; } .shade.on { opacity:var(--dimv); }
canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
#sky { image-rendering:pixelated; opacity:.95; transition:opacity .6s; } .nostars #sky, .nostars .tw { opacity:0; display:none; }
.tw { position:fixed; width:3px; height:3px; margin:-1px 0 0 -1px; color:var(--text); background:currentColor; box-shadow:3px 0,-3px 0,0 3px,0 -3px; pointer-events:none; animation:tw var(--d,5s) steps(1) infinite; animation-delay:var(--l,0s); } @keyframes tw { 0% { opacity:1; } 70% { opacity:.25; } 78% { opacity:1; } }
#shoot { position:fixed; width:54px; height:3px; background:linear-gradient(90deg,transparent,var(--text)); opacity:0; pointer-events:none; }
#shoot.go { animation:shoot 1s steps(16) forwards; } @keyframes shoot { from { opacity:0; transform:rotate(var(--a)) translateX(0); } 18% { opacity:.9; } to { opacity:0; transform:rotate(var(--a)) translateX(560px); } }

.plain .wp, .plain .wp2, .plain .shade, .plain canvas { display:none; }
main { position:relative; height:100%; }
/* the page, as in the picture: a thin large clock, the greeting, a big round search bar, three panels, then the sites */
.core { position:absolute; inset:0 0 64px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 5vw; z-index:2; }
.top { display:flex; flex-direction:column; align-items:center; text-align:center; animation:up .8s cubic-bezier(.2,.8,.2,1) both; }
#clock { font-size:clamp(66px,12.4vh,122px); font-weight:200; line-height:1; letter-spacing:-.045em; font-variant-numeric:tabular-nums; color:color-mix(in srgb,var(--text) 94%,transparent); margin-bottom:.1em; }
#hi { font-size:clamp(28px,4.4vh,42px); font-weight:640; letter-spacing:-.03em; line-height:1.15; color:var(--text); } #date { color:var(--dim); font-size:clamp(13px,1.9vh,16px); margin-top:8px; } .nogreet #hi, .nogreet #date { display:none; }
form { position:relative; width:min(800px,100%); margin-top:clamp(20px,4.2vh,40px); animation:up .8s cubic-bezier(.2,.8,.2,1) .08s both; }
input { width:100%; height:60px; border-radius:30px; border:0; outline:0; padding:0 100px 0 62px; font:inherit; font-size:17px; color:var(--text); background:linear-gradient(180deg,color-mix(in srgb,var(--text) 5%,transparent),color-mix(in srgb,var(--text) 2.5%,transparent)); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 13%,transparent); transition:box-shadow .2s,background .2s,color .35s; user-select:text; }
.plain input { background:color-mix(in srgb,var(--text) 6%,var(--bg)); }
input::placeholder { color:color-mix(in srgb,var(--text) 58%,transparent); }
input:focus { box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 75%,transparent),0 0 0 5px color-mix(in srgb,var(--accent) 14%,transparent); }
form svg { position:absolute; left:24px; top:19px; width:22px; height:22px; stroke:color-mix(in srgb,var(--text) 82%,transparent); fill:none; stroke-width:1.6; stroke-linecap:round; }
kbd { font:500 12px 'Inter'; color:color-mix(in srgb,var(--text) 70%,transparent); border-radius:8px; padding:4px 9px; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 22%,transparent); letter-spacing:.01em; }
form kbd { position:absolute; right:18px; top:16px; }
.stats { display:flex; justify-content:center; flex-wrap:wrap; gap:24px; margin-top:clamp(18px,3.4vh,30px); animation:up .8s cubic-bezier(.2,.8,.2,1) .2s both; } .nostats .stats { display:none; }
.card { display:flex; align-items:center; gap:14px; height:66px; min-width:222px; padding:0 20px 0 18px; border-radius:17px; background:color-mix(in srgb,var(--text) 3%,transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 11%,transparent); }
.card .ci { width:27px; height:27px; flex:none; stroke:color-mix(in srgb,var(--text) 86%,transparent); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.card .tx { display:flex; flex-direction:column; gap:1px; } .card b { font-size:17px; font-weight:620; letter-spacing:-.01em; color:var(--text); font-variant-numeric:tabular-nums; line-height:1.15; } .card small { font-size:12px; color:var(--dim); line-height:1.2; }
.card .dc { margin-left:auto; padding-left:16px; display:grid; place-items:center; } .card .dc svg { width:22px; height:22px; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; } .card .ok { stroke:#34d399; } .card .off { stroke:var(--dim); } .card .moon { stroke:color-mix(in srgb,var(--text) 82%,transparent); stroke-width:1.6; } .card .dc svg.spark { width:50px; height:24px; overflow:visible; stroke-width:1.6; }
/* the picture's background: dark ground with large smooth waves; every colour comes from the theme, so Settings > Appearance changes it live */
.wp[data-wall="waves"] { background:var(--wbase,#0a0a10); }
#waves { position:absolute; inset:0; width:100%; height:100%; display:none; } .wp[data-wall="waves"] #waves { display:block; }
#waves .glow { filter:url(#wblur); } #waves path { vector-effect:non-scaling-stroke; }
#planets { margin-top:clamp(18px,4vh,34px); pointer-events:none; z-index:3; } #planets > * { pointer-events:auto; } .nosites #planets { display:none; }
.pl { position:absolute; width:76px; margin-left:-38px; margin-top:-32px; display:flex; flex-direction:column; align-items:center; gap:7px; color:var(--dim); text-decoration:none; font-size:11.5px; animation:pop .65s cubic-bezier(.34,1.4,.64,1) both; animation-delay:calc(var(--i) * 80ms + .35s); transition:color .15s,transform .2s cubic-bezier(.2,.8,.2,1); }
.pl:hover { color:var(--text); transform:translateY(-3px) scale(1.08); } .pl:active { transform:scale(.96); }
.pl .ic { width:62px; height:62px; border-radius:50%; display:grid; place-items:center; font-size:22px; font-weight:650; color:#fff; background:color-mix(in srgb,var(--text) 9%,var(--bg)); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 13%,transparent),0 10px 26px rgba(0,0,0,.34),0 0 0 6px color-mix(in srgb,var(--accent) 9%,transparent); overflow:hidden; }
.pl .ic img { width:34px; height:34px; object-fit:contain; border-radius:8px; }
.pl .n { max-width:88px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 1px 10px var(--bg),0 0 4px var(--bg); }
#planets.flat { display:grid; grid-template-columns:repeat(4,96px); gap:14px 8px; width:max-content; } #planets.flat .pl { position:static; margin:0; width:96px; }
.tips { position:absolute; left:0; right:0; bottom:26px; display:flex; justify-content:center; gap:22px; color:var(--dim); font-size:12.5px; animation:up .8s cubic-bezier(.2,.8,.2,1) .3s both; z-index:2; } .tips div { display:flex; align-items:center; gap:8px; }
@media (max-height:700px) { .tips { display:none; } }
@keyframes up { from { opacity:0; transform:translateY(14px); } }
@keyframes pop { from { opacity:0; transform:scale(.55); } }
.plain * { animation:none !important; transition:none !important; backdrop-filter:none !important; }
</style>
</head>
<body>
<div class="wp" id="wp"><svg id="waves" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <filter id="wblur" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="wA" x1="1" y1="0" x2="0.35" y2="0.8"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.05"/><stop offset=".55" style="stop-color:var(--accent);stop-opacity:.16"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.34"/></linearGradient>
    <linearGradient id="wB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.0"/><stop offset=".5" style="stop-color:var(--accent);stop-opacity:.10"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.30"/></linearGradient>
    <linearGradient id="wS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.0"/><stop offset=".35" style="stop-color:var(--accent);stop-opacity:.75"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.1"/></linearGradient>
  </defs>
  <path d="M1040 -20C1380 20 1700 250 1730 700L1730 -20Z" fill="url(#wA)"/>
  <path class="glow" d="M1040 -20C1380 20 1700 250 1730 700" fill="none" stroke="url(#wS)" stroke-width="16" opacity=".5"/>
  <path d="M1040 -20C1380 20 1700 250 1730 700" fill="none" stroke="url(#wS)" stroke-width="2"/>
  <path d="M-30 520C230 560 380 760 700 980L-30 980Z" fill="url(#wB)"/>
  <path class="glow" d="M-30 520C230 560 380 760 700 980" fill="none" stroke="url(#wS)" stroke-width="16" opacity=".45"/>
  <path d="M-30 520C230 560 380 760 700 980" fill="none" stroke="url(#wS)" stroke-width="2"/>
  <path d="M-30 690C150 720 270 850 440 980L-30 980Z" fill="url(#wB)" opacity=".8"/>
  <path d="M-30 690C150 720 270 850 440 980" fill="none" stroke="url(#wS)" stroke-width="1.6" opacity=".8"/>
</svg></div><div class="wp2" id="wp2"></div><div class="shade" id="shade"></div>
<canvas id="sky"></canvas><div id="shoot" aria-hidden="true"></div>
<main>
  <div class="core">
    <div class="top"><div id="clock"></div><div id="hi"></div><div id="date"></div></div>
    <form id="f"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Search or enter address" autocomplete="off" spellcheck="false" autofocus><kbd>Ctrl K</kbd></form>
    <div class="stats" id="stats"></div>
    <div id="planets"></div>
  </div>
  <div class="tips"><div><kbd>Ctrl</kbd><kbd>K</kbd>search anything</div><div><kbd>Ctrl</kbd><kbd>T</kbd>new tab</div><div><kbd>Ctrl</kbd><kbd>E</kbd>all tabs</div></div>
</main>
<script>
const P = new URLSearchParams(location.search);
const root = document.documentElement, rs = root.style;
const wp = document.getElementById('wp');
const mix = (hex, to, p) => { const n = parseInt(hex.slice(1), 16), m = parseInt(to.slice(1), 16), c = (sh) => Math.round(((n >> sh) & 255) * (1 - p) + ((m >> sh) & 255) * p); return '#' + [16, 8, 0].map((sh) => c(sh).toString(16).padStart(2, '0')).join(''); };
const lum = (hex) => { const n = parseInt(hex.slice(1), 16); return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255; };
const apply = (t) => {
  for (const k of ['bg', 'chrome', 'accent', 'text', 'dim']) if (t[k]) rs.setProperty('--' + k, t[k]);
  if (/^#[0-9a-f]{6}$/i.test(t.bg || '')) rs.setProperty('--wbase', lum(t.bg) > 0.55 ? mix(t.bg, '#ffffff', 0.4) : mix(t.bg, '#000000', 0.62)); // the ground of the waves: much darker than the page in a dark theme, brighter in a light one
};
apply(Object.fromEntries(['bg', 'chrome', 'accent', 'text', 'dim'].map((k) => [k, P.get(k)])));
if (P.get('fx') === '0') root.classList.add('plain');
wp.dataset.wall = P.get('wall') || '';
const engine = P.get('engine') || 'https://duckduckgo.com/?q=%s';
const keywords = String(P.get('kw') || '').split(/\r?\n/).map((l) => l.trim().match(/^(\S+)\s+(https?:\/\/\S*%s\S*)/i)).filter(Boolean); // the address bar's keywords (yt cats)
const clock = document.getElementById('clock');
const clockTick = () => { // the time, the greeting and the date; the next update is due when the minute changes
  const d = new Date(), h = d.getHours();
  clock.textContent = String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  document.getElementById('hi').textContent = h < 5 ? 'Still up?' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  document.getElementById('date').textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  setTimeout(clockTick, (60 - d.getSeconds()) * 1000 + 60);
};
clockTick();
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = document.getElementById('q').value.trim(); if (!t) return;
  location.href = /^(https?|file):/i.test(t) ? t : (!/\s/.test(t) && (/^localhost/i.test(t) || /^[^\s/]+\.[a-z]{2,}([:/?#]|$)/i.test(t))) ? 'https://' + t : (() => { const m = /^(\S+)\s+(.+)$/.exec(t), e = m && keywords.find((x) => x[1].toLowerCase() === m[1].toLowerCase()); return (e ? e[2] : engine).replace('%s', encodeURIComponent(e ? m[2].trim() : t)); })();
});
const hue = (s) => { let n = 0; for (const c of s) n = (n * 31 + c.charCodeAt(0)) % 360; return n; };
const brandOf = (h) => { const p = String(h || '').toLowerCase().replace(/^www\./, '').split('.'); if (p.length < 2) return p[0] || ''; let i = p.length - 2; if (i > 0 && p[p.length - 1].length === 2 && /^(co|com|org|net|gov|edu|ac)$/.test(p[i])) i--; return p[i]; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const planets = document.getElementById('planets');
let sitesData = [];
// the browser pushes your most visited sites (with their real icons) once this page has loaded
window.novaSites = (sites) => { sitesData = (sites || []).slice(0, 8); placeSites(); };
// and a few numbers about the browser itself
window.novaStats = (s) => {
  const el = document.getElementById('stats'), fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + ' GB' : Math.round(n) + ' MB');
  if (!s) return root.classList.add('nostats');
  root.classList.remove('nostats');
  const sp = (a) => { // the memory of the last minutes as a small line with a dot at each end
    const v = (a && a.length > 1 ? a : [s.used, s.used]).slice(-16), lo = Math.min(...v), hi = Math.max(...v), span = Math.max(hi - lo, hi * 0.04, 1), W = 48, H = 22;
    const pts = v.map((x, i) => [(i / (v.length - 1)) * (W - 6) + 3, H - 4 - ((x - lo) / span) * (H - 8)]);
    return `<svg class="spark ok" viewBox="0 0 ${W} ${H}"><polyline points="${pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none"/><circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="2.2" fill="#34d399" stroke="none"/><circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="2.2" fill="#34d399" stroke="none"/></svg>`;
  };
  const card = (icon, val, label, deco) => `<div class="card"><svg class="ci" viewBox="0 0 24 24">${icon}</svg><div class="tx"><b>${val}</b><small>${label}</small></div><div class="dc">${deco}</div></div>`;
  const chip = '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/>';
  const shield = '<path d="M12 3 4.5 6v5.6c0 4.2 3 7.6 7.5 9.4 4.5-1.8 7.5-5.2 7.5-9.4V6Z"/>';
  const bolt = '<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>';
  const n = s.asleep || 0;
  el.innerHTML = card(chip, fmt(s.used), 'Memory usage', sp(s.hist))
    + card(shield, (s.blocked || 0).toLocaleString('en-US'), 'Ads &amp; trackers blocked', s.ads === false ? '<svg class="off" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>' : '<svg class="ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>')
    + card(bolt, n + ' tab' + (n === 1 ? '' : 's'), 'Sleeping tabs', '<svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></svg>');
};
// the most visited sites sit as a plain grid under the search box: four in a short window, eight in a tall one
function placeSites() {
  if (!sitesData.length) { planets.innerHTML = ''; return; }
  const list = sitesData.slice(0, innerHeight < 760 ? 4 : 8);
  planets.innerHTML = list.map((s, i) => `<a class="pl" style="--i:${i}" href="${esc(s.url)}" title="${esc(s.host)}"><div class="ic" style="${s.icon ? '' : `background:linear-gradient(135deg,hsl(${hue(brandOf(s.host))} 50% 46%),hsl(${(hue(brandOf(s.host)) + 30) % 360} 50% 36%))`}">${s.icon ? `<img src="${s.icon}" alt="">` : esc((brandOf(s.host)[0] || '?').toUpperCase())}</div><span class="n">${esc(s.host.replace(/^www\./, '').replace(/\.[a-z]+$/, ''))}</span></a>`).join('');
  planets.classList.add('flat');
}

// ---- backgrounds: pixel art, drawn once when the size or the colours change. Nothing moves, except in the Complete profile: a few stars blink and one shoots by now and then ----
const sky = document.getElementById('sky'), sg = sky.getContext('2d'), shoot = document.getElementById('shoot'), PX = 3;
const cssv = (n) => getComputedStyle(root).getPropertyValue(n).trim();
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const WALLS = ['stars', 'glow', 'dots']; // the pixel backgrounds are drawn on the canvas; 'waves' is an SVG in the page and needs no canvas
let prof = P.get('prof') || 'nova', shootTimer = 0;
const complete = () => prof === 'complete' && !root.classList.contains('plain');
function scheduleShoot() {
  clearTimeout(shootTimer);
  shootTimer = setTimeout(() => {
    if (complete() && !document.hidden) { shoot.style.cssText = `left:${Math.round(Math.random() * innerWidth * .6)}px;top:${Math.round(Math.random() * innerHeight * .3)}px;--a:${(22 + Math.random() * 18).toFixed(0)}deg`; shoot.classList.remove('go'); void shoot.offsetWidth; shoot.classList.add('go'); }
    scheduleShoot();
  }, 16000 + Math.random() * 16000);
}
function paintWall() {
  const kind = wp.dataset.wall, W = Math.ceil(innerWidth / PX), H = Math.ceil(innerHeight / PX);
  document.querySelectorAll('.tw').forEach((e) => e.remove()); clearTimeout(shootTimer);
  sky.width = W; sky.height = H; sg.clearRect(0, 0, W, H);
  if (root.classList.contains('plain') || !WALLS.includes(kind) || root.classList.contains('noimage')) return;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const accent = cssv('--accent'), light = cssv('--text');
  if (kind === 'stars') {
    for (let i = 0, n = Math.round(W * H / 400); i < n; i++) { const a = rnd(); sg.globalAlpha = a < .6 ? .28 : a < .9 ? .5 : .8; sg.fillStyle = rnd() < .08 ? accent : light; sg.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H), 1, 1); }
    const big = Math.max(6, Math.round(W * H / 24000)); // the brighter stars are small pixel crosses
    for (let i = 0; i < big; i++) { const x = 3 + Math.floor(rnd() * (W - 6)), y = 3 + Math.floor(rnd() * (H - 6)); sg.fillStyle = light; sg.globalAlpha = .9; sg.fillRect(x, y, 1, 1); sg.globalAlpha = .4; sg.fillRect(x - 1, y, 1, 1); sg.fillRect(x + 1, y, 1, 1); sg.fillRect(x, y - 1, 1, 1); sg.fillRect(x, y + 1, 1, 1); }
    if (complete()) { for (let i = 0; i < 22; i++) { const e = document.createElement('i'); e.className = 'tw'; e.style.cssText = `left:${Math.floor(rnd() * W) * PX}px;top:${Math.floor(rnd() * H) * PX}px;--d:${(3 + rnd() * 5).toFixed(1)}s;--l:-${(rnd() * 8).toFixed(1)}s`; document.body.appendChild(e); } }
  } else if (kind === 'glow') { // an accent glow dithered with a 4 x 4 matrix: two colours only, like an old screen
    sg.fillStyle = accent; sg.globalAlpha = .36; const cx = W / 2, cy = H * .46, R = Math.min(W * .5, H * .8);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const f = Math.max(0, 1 - Math.hypot((x - cx) / 1.5, y - cy) / R); if (f * f * f > (BAYER[(y & 3) * 4 + (x & 3)] + .5) / 16) sg.fillRect(x, y, 1, 1); }
  } else { // dots: one pixel every eight, fading out towards the edges
    sg.fillStyle = accent;
    for (let y = 4; y < H; y += 8) for (let x = 4; x < W; x += 8) { const a = .55 - Math.hypot((x - W / 2) / W, (y - H * .42) / H) * .85; if (a > .04) { sg.globalAlpha = a; sg.fillRect(x, y, 1, 1); } }
  }
  if (complete()) scheduleShoot();
}
const refresh = () => { paintWall(); placeSites(); };
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(refresh, 120); });
requestAnimationFrame(refresh); // after first layout
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(refresh, 120); }).observe(document.querySelector('main'));
// live theme updates from the browser: colours, wallpaper, switches
window.novaTheme = (t) => {
  apply(t); wp.dataset.wall = t.wall || ''; if (t.prof) prof = t.prof;
  if (t.fx !== undefined) root.classList.toggle('plain', !t.fx);
  rs.setProperty('--dimv', (t.dim_amount ?? 25) / 100); rs.setProperty('--blurv', (t.blur ?? 0) + 'px');
  const img = document.getElementById('wp2'), shade = document.getElementById('shade');
  if (t.image) { img.style.backgroundImage = `url(${t.image})`; img.classList.add('on'); shade.classList.add('on'); wp.style.opacity = 0; } else { img.classList.remove('on'); shade.classList.remove('on'); wp.style.opacity = 1; }
  root.classList.toggle('noimage', !!t.image);
  root.classList.toggle('nostars', t.stars === false || !!t.image || !WALLS.includes(t.wall)); root.classList.toggle('nosites', t.sites === false); root.classList.toggle('nogreet', t.greeting === false); root.classList.toggle('nostats', t.stats === false);
  refresh();
};
if (!WALLS.includes(wp.dataset.wall)) root.classList.add('nostars');
</script>
</body>
</html>
