<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Nova</title>
<style>
@font-face { font-family:'Inter'; src:url(fonts/inter-latin-wght-normal.woff2) format('woff2'); font-weight:100 900; }
:root { --bg:#0b0b12; --surface:#1c1c28; --text:#ececf3; --dim:#8b8ba0; --accent:#8b7dff; --line:rgba(255,255,255,.1); }
* { box-sizing:border-box; margin:0; }
html,body { height:100%; background:var(--bg); color:var(--text); font:450 13px/1.4 'Inter',system-ui,sans-serif; letter-spacing:-.006em; overflow:hidden; user-select:none; -webkit-font-smoothing:antialiased; }
body { display:flex; align-items:center; gap:6px; padding:0 10px; box-shadow:inset 0 -1px 0 var(--line); }
button { font:inherit; color:inherit; background:none; border:0; cursor:default; }
.b { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--dim); flex:none; transition:background .12s,color .12s,transform .1s; } .b:hover { background:rgba(255,255,255,.08); color:var(--text); } .b:active { transform:scale(.94); } .b[disabled] { opacity:.3; pointer-events:none; }
.b svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.mark { width:20px; height:20px; margin:0 6px 0 2px; flex:none; }
#u { flex:1; min-width:0; height:32px; border:0; outline:0; border-radius:11px; padding:0 14px; font:inherit; font-size:13.5px; color:var(--text); background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); user-select:text; transition:box-shadow .15s; } #u:focus { box-shadow:inset 0 0 0 1.5px var(--accent); } #u::placeholder { color:var(--dim); }
.back { display:flex; align-items:center; gap:7px; height:30px; padding:0 12px 0 9px; border-radius:9px; color:var(--text); font-weight:550; background:color-mix(in srgb,var(--accent) 16%,transparent); flex:none; transition:background .12s,transform .1s; } .back:hover { background:color-mix(in srgb,var(--accent) 28%,transparent); } .back:active { transform:scale(.97); } .back svg { width:15px; height:15px; fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.load { position:absolute; left:0; right:0; bottom:0; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:0; transition:opacity .2s; } .loading .load { opacity:1; animation:slide 1.1s ease-in-out infinite; } @keyframes slide { from { transform:translateX(-60%); } to { transform:translateX(60%); } }
</style>
</head>
<body>
<img class="mark" src="mark.svg" alt="">
<button class="b" id="bk" title="Back (Alt+Left)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
<button class="b" id="fw" title="Forward (Alt+Right)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
<button class="b" id="rl" title="Reload (Ctrl+R)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
<input id="u" placeholder="Search or enter address" autocomplete="off" spellcheck="false">
<button class="back" id="rt" title="Put this tab back into the main Nova window"><svg viewBox="0 0 24 24"><path d="M3 12h13M11 6l6 6-6 6M21 4v16"/></svg>Back to Nova</button>
<div class="load"></div>
<script>
const $ = (s) => document.querySelector(s), P = new URLSearchParams(location.search), rs = document.documentElement.style;
for (const k of ['bg', 'surface', 'text', 'dim', 'accent']) if (P.get(k)) rs.setProperty('--' + k, P.get(k));
const u = $('#u');
let shown = '';
mini.onState((s) => {
  $('#bk').disabled = !s.back; $('#fw').disabled = !s.forward; document.body.classList.toggle('loading', !!s.loading);
  $('#rl').title = s.loading ? 'Stop' : 'Reload (Ctrl+R)';
  shown = s.url || '';
  if (document.activeElement !== u) u.value = shown.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
});
mini.onFocus(() => { u.focus(); u.select(); });
u.addEventListener('focus', () => { u.value = shown; u.select(); });
u.addEventListener('blur', () => { u.value = shown.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''); });
u.addEventListener('keydown', (e) => { if (e.key === 'Enter') { mini.cmd('go', u.value); u.blur(); } else if (e.key === 'Escape') u.blur(); });
$('#bk').onclick = () => mini.cmd('back'); $('#fw').onclick = () => mini.cmd('forward'); $('#rl').onclick = () => mini.cmd('reload'); $('#rt').onclick = () => mini.cmd('return');
</script>
</body>
</html>
